[workspace]
resolver = "3"
# src-tauri and plugins are deliberately not members (see .kiro/steering/tech.md).
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
buslink-core = { path = "crates/buslink-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", default-features = false, features = ["sync"] }
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled"] }
rust_xlsxwriter = { version = "=0.102.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
