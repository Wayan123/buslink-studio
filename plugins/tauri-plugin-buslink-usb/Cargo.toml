[package]
name = "tauri-plugin-buslink-usb"
version = "0.1.0"
description = "BusLink Studio: USB serial (usb-serial-for-android), foreground service and SAF export for Android. Desktop builds compile to stubs."
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false
links = "tauri-plugin-buslink-usb"

# Not a member of the root workspace (see .kiro/steering/tech.md).
[workspace]

[build-dependencies]
tauri-plugin = { version = "=2.7.2", features = ["build"] }

[dependencies]
tauri = { version = "=2.12.5" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
